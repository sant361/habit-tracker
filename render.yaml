services:
  - type: web
    name: habit-tracker
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Pega aquí la dirección de tu base de datos de Neon (ver README)
      - key: DATABASE_URL
        sync: false
